<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>SkillYards | Offline</title>
    <style>
      :root {
        --background: #f3f3f3;
        --foreground: #000000;
        --card: #f9f5ff;
        --card-foreground: #28262c;
        --primary: #030e5a;
        --primary-foreground: #fefefe;
        --secondary: #d4c2fc;
        --secondary-foreground: #14248a;
        --muted: #998fc7;
        --muted-foreground: #28262c;
        --accent: #d4c2fc;
        --accent-foreground: #14248a;
        --border: #d4c2fc;
        --ring: #14248a;
        --surface: color-mix(in srgb, var(--card) 72%, white);
        --surface-strong: color-mix(in srgb, var(--card) 90%, white);
        --surface-border: color-mix(in srgb, var(--border) 48%, transparent);
        --shadow: 0 30px 80px
          color-mix(in srgb, var(--primary) 16%, transparent);
        --hero-glow-primary: color-mix(
          in srgb,
          var(--primary) 16%,
          transparent
        );
        --hero-glow-secondary: color-mix(
          in srgb,
          var(--secondary) 28%,
          transparent
        );
        --deep-panel: #28262c;
        --deep-panel-2: #1f1d22;
        --deep-text: #f9f5ff;
        --deep-muted: rgba(249, 245, 255, 0.74);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --background: #28262c;
          --foreground: #ffffff;
          --card: #28262c;
          --card-foreground: #f9f5ff;
          --primary: #d4c2fc;
          --primary-foreground: #14248a;
          --secondary: #998fc7;
          --secondary-foreground: #f9f5ff;
          --muted: #14248a;
          --muted-foreground: #f9f5ff;
          --accent: #998fc7;
          --accent-foreground: #f9f5ff;
          --border: #998fc7;
          --ring: #d4c2fc;
          --surface: color-mix(in srgb, var(--card) 78%, white 10%);
          --surface-strong: color-mix(in srgb, var(--card) 92%, white 6%);
          --surface-border: color-mix(in srgb, var(--border) 38%, transparent);
          --shadow: 0 30px 80px rgba(0, 0, 0, 0.34);
          --hero-glow-primary: color-mix(
            in srgb,
            var(--primary) 12%,
            transparent
          );
          --hero-glow-secondary: color-mix(
            in srgb,
            var(--secondary) 12%,
            transparent
          );
          --deep-panel: #1f1d22;
          --deep-panel-2: #141218;
          --deep-text: #f9f5ff;
          --deep-muted: rgba(249, 245, 255, 0.74);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--foreground);
        background:
          radial-gradient(
            circle at top left,
            var(--hero-glow-primary),
            transparent 28%
          ),
          radial-gradient(
            circle at bottom right,
            var(--hero-glow-secondary),
            transparent 28%
          ),
          linear-gradient(
            135deg,
            color-mix(in srgb, var(--background) 96%, white) 0%,
            var(--background) 100%
          );
        overflow: hidden;
        padding: 18px;
      }

      .shell {
        width: min(760px, 100%);
        height: calc(100vh - 36px);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .panel {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--surface-border);
        border-radius: 32px;
        background: var(--surface);
        backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
      }

      .content {
        padding: 38px;
        display: flex;
        flex-direction: column;
        min-height: 100%;
        justify-content: center;
        text-align: center;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
      }

      .brand img {
        width: auto;
        height: 44px;
        display: block;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--primary) 10%, transparent);
        color: var(--primary);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        align-self: center;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        box-shadow: 0 0 0 6px
          color-mix(in srgb, var(--primary) 14%, transparent);
      }

      h1 {
        margin: 18px 0 14px;
        max-width: 12ch;
        font-size: clamp(38px, 5.2vw, 66px);
        line-height: 0.98;
        letter-spacing: -0.04em;
        align-self: center;
      }

      p {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 16px;
        line-height: 1.6;
      }

      .lead {
        max-width: 34ch;
        align-self: center;
      }

      .actions {
        display: flex;
        flex-wrap: nowrap;
        justify-content: center;
        gap: 14px;
        margin-top: 24px;
      }

      .button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        min-height: 50px;
        padding: 13px 22px;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button-primary {
        color: var(--primary-foreground);
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary-foreground) 100%
        );
        box-shadow: 0 18px 40px
          color-mix(in srgb, var(--primary) 28%, transparent);
      }

      .button-secondary {
        color: var(--foreground);
        background: var(--surface-strong);
        border: 1px solid var(--surface-border);
      }

      .status-badge {
        width: fit-content;
        padding: 10px 14px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--primary) 8%, transparent);
        border: 1px solid color-mix(in srgb, var(--border) 32%, transparent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--primary);
      }

      @media (max-width: 1100px) {
        .shell {
          max-width: 860px;
          height: calc(100vh - 36px);
        }

        .content {
          padding: 24px;
        }

        h1 {
          max-width: 13ch;
          font-size: clamp(34px, 5vw, 54px);
        }
      }

      @media (max-width: 820px) {
        body {
          padding: 12px;
        }

        .shell {
          height: calc(100vh - 24px);
        }

        .brand {
          margin-bottom: 18px;
        }

        .brand img {
          height: 38px;
        }

        h1 {
          margin-top: 14px;
          font-size: clamp(30px, 8vw, 42px);
          max-width: none;
        }

        p,
        .status-copy p {
          font-size: 13px;
        }

        .actions {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        .button {
          width: 100%;
          justify-content: center;
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 10px;
        }

        .shell {
          height: calc(100vh - 20px);
        }

        .panel {
          border-radius: 24px;
        }

        .content {
          padding: 16px;
        }

        .eyebrow,
        .status-badge {
          font-size: 12px;
          padding: 9px 13px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <div class="content">
          <a class="brand" href="/" aria-label="SkillYards home">
            <img src="/images/logo-dark.svg" alt="SkillYards" />
          </a>

          <div class="eyebrow">
            <span class="dot"></span>
            Offline Mode
          </div>

          <h1>You are offline right now.</h1>

          <p class="lead">Reconnect to continue exploring SkillYards.</p>

          <div class="actions">
            <button
              class="button button-primary"
              type="button"
              onclick="window.location.reload()"
            >
              Try Again
            </button>
            <a class="button button-secondary" href="/"> Go To Homepage </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
