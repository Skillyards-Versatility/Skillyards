name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild and reload all apps"
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            export PM2_HOME="/root/.pm2"

            cd /var/www/skillyards
            OLD_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)

            CHANGED=$(git diff --name-only "$OLD_SHA" "$NEW_SHA")
            echo "Changed files:"
            echo "$CHANGED"

            FORCE_ALL="${{ inputs.force_all || 'false' }}"

            if [ "$FORCE_ALL" = "true" ] || echo "$CHANGED" | grep -qE "^(package\.json|package-lock\.json|packages/)"; then
              echo "Shared deps or packages changed -> full install + sequential build"
              npm ci
              npm run build -w apps/api
              npm run build -w apps/admin
              npm run build -w apps/website
              npm run build -w apps/cms
              pm2 reload all
              exit 0
            fi

            if echo "$CHANGED" | grep -q "^apps/api/"; then
              npm run build -w apps/api
              pm2 reload skillyards-api
            fi

            if echo "$CHANGED" | grep -q "^apps/admin/"; then
              npm run build -w apps/admin
              pm2 reload skillyards-admin
            fi

            if echo "$CHANGED" | grep -q "^apps/website/"; then
              npm run build -w apps/website
              pm2 reload skillyards-website
            fi

            if echo "$CHANGED" | grep -q "^apps/cms/"; then
              npm run build -w apps/cms
            fi

            if echo "$CHANGED" | grep -q "^apps/pdf-service/"; then
              pm2 reload skillyards-pdf
            fi

      - name: Notify success on ntfy
        if: success()
        run: |
          curl -s -H "Title: Skillyards Deploy OK" -H "Priority: default" \
            -d "Deployed ${{ github.sha }} to VPS" \
            https://ntfy.sh/Skillyards-vps-989759 || true

      - name: Notify failure on ntfy
        if: failure()
        run: |
          curl -s -H "Title: Skillyards Deploy FAILED" -H "Priority: high" \
            -d "Deploy failed on commit ${{ github.sha }}" \
            https://ntfy.sh/Skillyards-vps-989759 || true
